<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlanMark — PDF Markup &amp; Takeoff</title>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<style>
:root{--bg:#1b1f25;--panel:#242930;--panel2:#2c323b;--line:#3a414c;--text:#e7eaef;--mut:#99a2b1;--acc:#3d8bfd;--accbg:#1f3a63;--canvas:#50565f;--danger:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0}
.bar::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.3px;padding:0 10px 0 4px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand i{width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#3d8bfd,#22c3a6);display:inline-block}
.sep{width:1px;align-self:stretch;background:var(--line);margin:3px 5px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--panel2)}
.btn:disabled{opacity:.35;cursor:default;background:none}
.btn.on{background:var(--accbg);border-color:var(--acc)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn.pri{background:var(--acc);color:#fff}
.btn.pri:hover{background:#2f78e6}
.tb{flex-direction:column;height:46px;min-width:40px;padding:3px 3px;gap:1px;font-size:10px;color:var(--mut)}
.tb.on{color:var(--text)}
.tb svg{width:20px;height:20px}
.grp{display:flex;align-items:center;gap:1px;flex-shrink:0}
.glab{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;padding:0 2px}
#zoomv,#pageIn{width:58px;height:26px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:5px}
#pageIn{width:42px}
#main{flex:1;display:flex;min-height:0;position:relative}
.side{width:250px;background:var(--panel);display:flex;flex-direction:column;min-height:0;flex-shrink:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);width:264px}
.side.hide{display:none}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1 0 30%;padding:7px 4px;background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;color:var(--mut);font-size:12px}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.pane{flex:1;overflow:auto;padding:8px;min-height:0}
.pane.hide{display:none}
.phead{font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#viewer{flex:1;overflow:auto;background:var(--canvas);position:relative;touch-action:none;min-width:0;user-select:none;-webkit-user-select:none}
#pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;width:max-content;min-width:100%;position:relative}
.page{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45);flex-shrink:0}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page svg.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.page .pn{position:absolute;left:0;top:-17px;font-size:11px;color:#d7dbe2}
#viewer.c-draw .page svg.ov{cursor:crosshair}
#viewer.c-pan,#viewer.c-pan .page svg.ov,#viewer.panning .page svg.ov{cursor:grab}
.mk .hit{stroke:transparent;fill:none}
#viewer.c-select .mk{cursor:move}
.hd{cursor:pointer}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#empty .card{background:var(--panel);border:1px dashed #6b7380;border-radius:12px;padding:28px;max-width:440px;text-align:center}
#empty h2{margin:6px 0 6px;font-size:20px}
#empty p{color:var(--mut);margin:0 0 16px}
#empty.drag .card{border-color:var(--acc);background:var(--accbg)}
#mlist{height:210px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
#mlist.col{height:auto}
#mlist.col .mlbody{display:none}
.mlhead{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0}
.mlbody{flex:1;overflow:auto;min-height:0}
table.ml{border-collapse:collapse;width:100%;font-size:12px}
table.ml th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
table.ml td{padding:4px 8px;border-bottom:1px solid #30363f;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
table.ml tr.sel td{background:var(--accbg)}
table.ml tbody tr:hover td{background:#2f3540;cursor:pointer}
table.ml tr.sel:hover td{background:#26487a}
table.ml td.num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;border:1px solid rgba(255,255,255,.3)}
#status{display:flex;align-items:center;gap:12px;padding:3px 10px;background:#15181d;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;flex-shrink:0}
#status .sp{flex:1;overflow:hidden;text-overflow:ellipsis}
#scaleBtn{background:none;border:1px solid var(--line);border-radius:4px;padding:1px 7px;cursor:pointer;color:var(--text)}
#live{color:#7dd3fc;font-variant-numeric:tabular-nums}
input.ti,select.ti,textarea.ti{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;outline:none}
input.ti:focus,select.ti:focus,textarea.ti:focus{border-color:var(--acc)}
textarea.ti{resize:vertical;min-height:54px}
.fld{margin-bottom:9px}
.fld>label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
input[type=color]{width:100%;height:28px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer}
input[type=range]{width:100%}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.meas{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px}
.meas b{font-size:16px;display:block;color:#7dd3fc}
.meas small{color:var(--mut)}
.hint{color:var(--mut);font-size:12px;line-height:1.5}
.hint kbd{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
.thumb{display:block;margin:0 auto 12px;cursor:pointer;text-align:center;font-size:11px;color:var(--mut)}
.thumb canvas{display:block;margin:0 auto 3px;background:#fff;border:2px solid transparent;max-width:100%}
.thumb.on canvas{border-color:var(--acc)}
.res{padding:6px 7px;border-radius:5px;cursor:pointer;font-size:12px;border-bottom:1px solid #30363f}
.res:hover{background:var(--panel2)}
.res mark{background:#facc15;color:#000;border-radius:2px}
.chest{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.chest:hover{background:var(--panel2)}
.chest.on{border-color:var(--acc);background:var(--accbg)}
.chest svg{width:20px;height:20px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chest .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chest .x{opacity:.5;background:none;border:0;cursor:pointer;padding:2px 4px}
.chest .x:hover{opacity:1;color:var(--danger)}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:12px 2px 6px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modalBg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:440px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin:0;padding:14px 16px 10px;font-size:15px}
.modal .mb{padding:4px 16px 8px;overflow:auto}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.modal .mf .btn{border:1px solid var(--line);height:32px;padding:0 14px}
.modal .mf .btn.pri{border-color:var(--acc)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stamps button{border:2px solid #c62828;color:#e57373;background:none;border-radius:6px;padding:9px 4px;font-weight:700;cursor:pointer;letter-spacing:.5px}
.stamps button:hover{background:#3a1f22}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#0f1216;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
#finish{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#finish.on{display:flex}
#finish .btn{border:1px solid var(--line)}
.lockdot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:#facc15;display:none}
.tb{position:relative}
.tb.locked .lockdot{display:block}
@media (max-width:820px){
 .side{position:absolute;top:0;bottom:0;z-index:15;box-shadow:0 0 30px rgba(0,0,0,.5)}
 #left{left:0}#right{right:0}
 #mlist{height:42vh}
 .tb{min-width:42px;font-size:9.5px}
 .hide-m{display:none}
}
</style>
</head>
<body>
<div id="app">
 <div class="bar" id="topbar">
  <div class="brand"><i></i>PlanMark</div>
  <button class="btn" id="bLeft" title="Toggle side panel"></button>
  <div class="sep"></div>
  <button class="btn" id="bOpen" title="Open PDF (Ctrl+O)"></button>
  <button class="btn" id="bSave" title="Save marked-up PDF" disabled></button>
  <button class="btn" id="bMore" title="Markup data: import/export" disabled></button>
  <div class="sep"></div>
  <button class="btn" id="bUndo" title="Undo (Ctrl+Z)" disabled></button>
  <button class="btn" id="bRedo" title="Redo (Ctrl+Y)" disabled></button>
  <div class="sep"></div>
  <button class="btn" id="bZout" title="Zoom out"></button>
  <input id="zoomv" value="100%" aria-label="Zoom">
  <button class="btn" id="bZin" title="Zoom in"></button>
  <button class="btn" id="bFitW" title="Fit width"></button>
  <button class="btn" id="bFitP" title="Fit page (Ctrl+0)"></button>
  <div class="sep"></div>
  <button class="btn" id="bPrev" title="Previous page"></button>
  <input id="pageIn" value="0" aria-label="Page"><span id="pageTot" style="color:var(--mut);padding:0 4px;white-space:nowrap">/ 0</span>
  <button class="btn" id="bNext" title="Next page"></button>
  <div class="sep"></div>
  <button class="btn" id="bSettings" title="Settings"></button>
  <button class="btn" id="bRight" title="Toggle properties"></button>
 </div>
 <div class="bar" id="ribbon"></div>
 <div id="main">
  <aside class="side" id="left">
   <div class="tabs"><button data-tab="pages" class="on">Pages</button><button data-tab="search">Search</button><button data-tab="chest">Tools</button></div>
   <div class="pane" id="pane-pages"><div class="hint">Open a PDF to see page thumbnails.</div></div>
   <div class="pane hide" id="pane-search">
    <div class="row" style="margin-bottom:8px"><input class="ti" id="sq" placeholder="Search text in PDF…"><button class="btn pri" id="sGo" style="flex:0">Go</button></div>
    <label class="chk" style="margin-bottom:8px"><input type="checkbox" id="sCase">Match case</label>
    <div id="sInfo" class="hint"></div>
    <div id="sRes"></div>
   </div>
   <div class="pane hide" id="pane-chest"></div>
  </aside>
  <div id="viewer" class="c-select">
   <div id="pages"></div>
   <div id="empty"><div class="card">
    <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#3d8bfd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 15l3-3 2 2 3-3"/></svg>
    <h2>Open a drawing set</h2>
    <p>Drop a PDF here, or open one to mark up, calibrate scale and run quantity takeoffs.</p>
    <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
     <button class="btn pri" id="eOpen" style="flex:0;height:36px;padding:0 16px">Open PDF</button>
     <button class="btn" id="eBlank" style="flex:0;height:36px;padding:0 16px;border:1px solid var(--line)">Blank 36×24 sheet</button>
    </div>
   </div></div>
  </div>
  <aside class="side" id="right">
   <div class="phead"><span>Properties</span></div>
   <div class="pane" id="props"></div>
  </aside>
  <div id="finish">
   <button class="btn pri" id="fDone">Finish</button>
   <button class="btn" id="fBack">Undo point</button>
   <button class="btn" id="fCancel">Cancel</button>
  </div>
 </div>
 <section id="mlist">
  <div class="mlhead">
   <button class="btn" id="mlToggle" style="font-weight:600"><span id="mlArrow">▾</span> Markups (<span id="mlCount">0</span>)</button>
   <input class="ti" id="mlFilter" placeholder="Filter…" style="max-width:200px;min-width:110px;height:28px">
   <button class="btn" id="mlSum">Summary</button>
   <button class="btn" id="mlCsv" title="Export markups list as CSV">Export CSV</button>
   <button class="btn" id="mlCopy" title="Copy as tab-separated for Excel">Copy</button>
   <button class="btn" id="mlDel" title="Delete selected" disabled>Delete</button>
  </div>
  <div class="mlbody" id="mlBody"></div>
 </section>
 <div id="status">
  <span class="sp" id="hint">Open a PDF to begin.</span>
  <span id="live"></span>
  <button id="scaleBtn" title="Set scale">Scale: —</button>
  <span id="coords" class="hide-m"></span>
 </div>
</div>
<div id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/pdf,.pdf" hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>
<script src="js/core.js"></script>
<script src="js/snap.js"></script>
<script src="js/layers.js"></script>
<script src="js/ocr.js"></script>
<script src="js/batch.js"></script>
<script src="js/sets.js"></script>
<script src="js/studio.js"></script>
<script src="js/toolbox.js"></script>
<script src="js/panels.js"></script>
<script src="js/auto.js"></script>
<script src="js/output.js"></script>
<script src="js/projects.js"></script>
<script src="js/measpro.js"></script>
<script src="js/listpro.js"></script>
<script src="js/docpro.js"></script>
<script src="js/views.js"></script>
<script src="js/pdfedit.js"></script>
<script src="js/cad.js"></script>
<script src="js/takeoff2.js"></script>
<script src="js/styles2.js"></script>
<script src="js/batch2.js"></script>
<script src="js/cloud.js"></script>
<script src="js/workspace.js"></script>
<script src="js/account.js"></script>
<script src="js/desktop.js"></script>
<script src="js/drafting.js"></script>
<script src="js/forms3.js"></script>
<script src="js/links3.js"></script>
<script src="js/compare3.js"></script>
<script src="js/i18n-es.js"></script>
<script src="js/docs3.js"></script>
</body>
</html>
